[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labtech-backend"
version = "0.1.0"
description = "API do Sistema de Gestao de Laboratorios e Salas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.18,<5.3",
    "djangorestframework>=3.18.1,<3.19",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "django-cors-headers>=4.7,<5",
]

[project.optional-dependencies]
dev = ["ruff>=0.14,<1", "pytest>=8,<10", "pytest-django>=4.11,<5"]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
